<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.nutanix.io_thread_controller1"/>
    <allow send_destination="com.nutanix.io_thread_controller1"/>
  </policy>
  <policy context="default">
    <deny own="com.nutanix.io_thread_controller1"/>
    <deny send_destination="com.nutanix.io_thread_controller1"
          send_interface="com.nutanix.io_thread_controller1"
          send_member="SetThreadCount"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nutanix.io_thread_controller1"
           send_interface="com.nutanix.io_thread_controller1"
           send_member="GetStats"/>
    <allow send_destination="com.nutanix.io_thread_controller1"
           send_interface="com.nutanix.io_thread_controller1"
           send_member="GetSnapshot"/>
  </policy>

</busconfig>
