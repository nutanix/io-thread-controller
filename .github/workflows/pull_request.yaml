name: Pull Request

on: pull_request

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@v3.2.0
  pre-push:
    strategy:
      matrix:
        toolchain:
          - stable
          - 1.92
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: "rustfmt,clippy"
      - uses: actions/cache@v6
        id: cache-target-restore
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-
      - run: sudo apt-get update
      - run: sudo apt-get install libvirt-dev fuse3 dbus python3-pytest python3-dbus
      - run: make pre-push
