[package]
name = "io-thread-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Discovers virtual I/O backends and dynamically scales their I/O thread pools."
license = "BSD-3-Clause"
resolver = "3"

[[bin]]
name = "io-thread-controller"
path = "src/main.rs"

# Live perf-plot and dashboard client for the daemon's fleet.
# Gated on the `tui` feature (on by default). Disable with
# `--no-default-features` plus the daemon features you still need.
[[bin]]
name = "iothread-tui"
path = "src/bin/iothread-tui.rs"
required-features = ["tui"]

[lib]
name = "io_thread_controller"
path = "src/lib.rs"

# Feature flags.
[features]
default = ["threshold-engine", "qemu-backend", "tui"]
threshold-engine = []
qemu-backend = ["dep:once_cell", "dep:virt"]
# TUI (`iothread-tui` binary), enabled by default.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "env-filter",
    "json",
] }
inotify = { version = "0.10", default-features = false, features = ["stream"] }
async-trait = "0.1"
futures-util = "0.3"
procfs = { version = "0.17", default-features = false }
sanitize-filename = "0.6.0"
regex = "1"

zbus = { version = "=5.12.0", default-features = false, features = ["tokio"] }
zbus_macros = "=5.12.0"
zbus_names = "=4.2.0"
zvariant = "=5.8.0"
zvariant_derive = "=5.8.0"
zvariant_utils = "=3.2.0"
indexmap = "=2.13.1"
toml_datetime = "=1.0.1"
toml_parser = "=1.0.10"
uds_windows = "=1.1.0"
uuid = "=1.20.0"

# latest versions that support Rust 1.84
virt = { version = "0.4", features = ["qemu"], optional = true }
once_cell = { version = "1.21.4", optional = true }
rustix = { version = "1.1.4", features = ["param"] }

ratatui = { version = "0.29", default-features = false, features = [
    "crossterm",
], optional = true }
crossterm = { version = "0.29", optional = true }

clap = { version = "=4.5.61", features = ["derive", "env"] }
clap_lex = "=1.0.1"
getrandom = "=0.3.4"
wasip2 = "=1.0.1+wasi-0.2.4"
linkme = "0.3.37"
lazy_static = "1.5.0"
glob = "0.3.4"
rstest = "0.26.1"
test-log = { version = "0.2.21", features = ["trace"] }
darling = "=0.21"
darling_core = "=0.21"
darling_macro = "=0.21"
unicode-segmentation = "=1.12.0"
instability = "=0.3.10"

# Only for the TUI:
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "=3.14.0"
tokio = { version = "1", features = ["test-util"] }
