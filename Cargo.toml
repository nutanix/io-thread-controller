[package]
name = "io-thread-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Discovers virtual I/O backends and dynamically scales their I/O thread pools."
license = "BSD-3-Clause"
resolver = "3"

[[bin]]
name = "io-thread-controller"
path = "src/main.rs"

# Live perf-plot and dashboard client for the daemon's fleet.
# Gated on the `tui` feature (on by default). Disable with
# `--no-default-features` plus the daemon features you still need.
[[bin]]
name = "iothread-tui"
path = "src/bin/iothread-tui.rs"
required-features = ["tui"]

# FUSE stand-in for `/proc`, used by component tests. One file so the
# harness does not depend on the separate mockfs crate.
[[bin]]
name = "mockfsd"
path = "src/bin/mockfsd.rs"
required-features = ["mockfs"]

[lib]
name = "io_thread_controller"
path = "src/lib.rs"

# Feature flags.
[features]
default = ["threshold-engine", "qemu-backend", "tui"]
threshold-engine = []
qemu-backend = ["dep:rustix", "dep:uuid", "dep:virt"]
# In-process VM stand-in used by component tests. Not part of a production build.
fake-backend = []
# `mockfsd` binary. Component tests mount it over a fake `/proc`.
mockfs = ["dep:fuser"]
# TUI (`iothread-tui` binary), enabled by default.
tui = ["dep:anyhow", "dep:ratatui", "dep:crossterm"]

[dependencies]
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "env-filter",
    "json",
] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
async-trait = "0.1"
futures-util = "0.3"
procfs = { version = "0.18", default-features = false }
regex = "1"

zbus = { version = "=5.12.0", default-features = false, features = ["tokio"] }
zbus_macros = "=5.12.0"
zbus_names = "=4.2.0"
zvariant = "=5.8.0"
zvariant_derive = "=5.8.0"
zvariant_utils = "=3.2.0"

# latest versions that support Rust 1.84
json-patch = { version = "3", default-features = false }
# libvirt Rust bindings, gated behind the `qemu` feature.  The
# `qemu` sub-feature of the crate exposes
# `virDomainQemuMonitorCommand`, which the backend uses for
# iothread lifecycle and vq-mapping passthrough (native
# `add_iothread` / `del_iothread` are not exposed by the crate
# yet -- see backends/qemu/libvirt.rs).

virt = { version = "0.4", features = ["qemu"], optional = true }
rustix = { version = "1", features = ["param"], optional = true }
uuid = { version = "=1.20.0", optional = true }

ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
], optional = true }
crossterm = { version = "0.29", optional = true }

fuser = { version = "0.18", optional = true }
clap = { version = "4", features = ["derive", "env"] }
linkme = "0.3.37"
glob = "0.3.4"
anyhow = { version = "1", optional = true }
statistical = "1.0.0"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
test-log = { version = "0.2", features = ["trace"] }
tokio = { version = "1", features = ["test-util"] }
proptest = "1"
